# ===================================================================
# CalibrateSys Production Configuration Profile (application-prod.properties)
# Activate via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# Server Port
server.port=${PORT:8080}

# MySQL Datasource Configuration (Must be externalized in production)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:calibrate_sys_prod}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Safe schema validation in production; never auto-drop or update)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Schema Initialization mode
spring.sql.init.mode=never

# Security & JWT Configuration (JWT_SECRET must be supplied externally and be at least 256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Must explicitly define permitted origins in production)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Initial Administrator Provisioning (Disabled by default in production)
app.security.init-admin.enabled=${INIT_ADMIN_ENABLED:false}
app.security.init-admin.email=${INIT_ADMIN_EMAIL:admin@calibratesys.edu}
app.security.init-admin.password=${INIT_ADMIN_PASSWORD:}

# Calibration Scheduling Configuration
app.calibration.upcoming-days=${CALIBRATION_UPCOMING_DAYS:30}

# Calibration Document Storage Configuration (External persistent directory recommended)
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:/var/data/calibratesys/documents}
app.documents.max-file-size=${DOCUMENTS_MAX_FILE_SIZE:10485760}

# Spring Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.calibratesys=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Demo Data Reset strictly disabled in production
app.demo-data.enabled=false
