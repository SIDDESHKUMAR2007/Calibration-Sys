# ===================================================================
# Smart Laboratory Equipment Calibration and Compliance Management System
# Foundation Application Configuration
# ===================================================================

# Application Information
spring.application.name=calibrate-sys
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Datasource Configuration
# Sensitive credentials can be overridden via environment variables:
#   DB_URL or DB_HOST, DB_PORT, DB_NAME
#   DB_USERNAME
#   DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:calibrate_sys_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# ddl-auto is set to 'update' to safely manage schema without dropping tables
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# SQL Schema Initialization mode
spring.sql.init.mode=never

# ===================================================================
# Security & JWT Configuration
# ===================================================================
# JWT Signing Secret (must be minimum 256 bits; override via JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:c21hcnQtbGFib3JhdG9yeS1lcXVpcG1lbnQtY2FsaWJyYXRpb24tc3lzdGVtLXNlY3JldC1rZXktMjAyNg==}
# JWT Token Expiration: 24 hours (in milliseconds)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (comma-separated; override in production via APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# ===================================================================
# Initial Administrator Provisioning (Development / Setup Mode)
# ===================================================================
app.security.init-admin.enabled=${INIT_ADMIN_ENABLED:true}
app.security.init-admin.email=${INIT_ADMIN_EMAIL:admin@calibratesys.edu}
app.security.init-admin.password=${INIT_ADMIN_PASSWORD:Admin@12345}
app.security.init-admin.staff-id=${INIT_ADMIN_STAFF_ID:ADMIN-001}
app.security.init-admin.first-name=${INIT_ADMIN_FIRST_NAME:System}
app.security.init-admin.last-name=${INIT_ADMIN_LAST_NAME:Admin}
app.security.init-admin.designation=${INIT_ADMIN_DESIGNATION:System Administrator}
app.security.init-admin.department=${INIT_ADMIN_DEPARTMENT:Administration}

# ===================================================================
# Calibration Scheduling Configuration
# ===================================================================
app.calibration.upcoming-days=${CALIBRATION_UPCOMING_DAYS:30}

# ===================================================================
# Calibration Document Storage Configuration
# ===================================================================
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:uploads/calibration-documents}
app.documents.max-file-size=${DOCUMENTS_MAX_FILE_SIZE:10485760}

# Spring Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

